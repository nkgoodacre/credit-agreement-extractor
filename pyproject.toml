[project]
name = "cae"
version = "0.1.0"
description = "LLM extraction pipeline for US syndicated credit agreements, with validation, grounding checks and field-level evaluation."
readme = "README.md"
authors = [
    { email = "nkechi.goodacre@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.1",
    "langchain-core>=1.6.2",
    "langchain-ollama>=1.1.0",
    "lxml>=6.1.3",
    "pydantic>=2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "streamlit>=1.63.0",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[project.scripts]
cae = "cae.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# docs/ holds prose and illustrative (non-runnable) code snippets in the
# build spec; keep the formatter and linter off it.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# Typer expresses option/argument metadata as call-valued defaults; this is
# the framework's intended usage, not the mutable-default footgun B008 targets.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "duckdb.*",
    "rapidfuzz.*",
    "bs4.*",
    "streamlit.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
